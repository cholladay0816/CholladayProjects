name: Dependency validation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      - run: php artisan view:cache
      - run: npm ci
      - run: npm run production

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: PHP advisories (known unresolved Laravel 8 and Flysystem 1 findings)
        run: composer audit --locked
      - name: JavaScript advisories (known unresolved Mix and Tailwind 2 findings)
        if: always()
        run: npm audit --include=dev
